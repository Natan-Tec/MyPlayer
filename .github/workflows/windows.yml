name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Testes da lógica
        run: npm test

      - name: Empacotar para Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $out = & node scripts/package.js 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 0 -or -not (Test-Path dist/M3UFlow-win32-x64/M3UFlow.exe)) {
            $tail = (($out -split "`n") | Select-Object -Last 12) -join "%0A"
            Write-Host "::error::Empacotamento falhou (código $code): $tail"
            exit 1
          }
          Copy-Item LEIA-ME.txt dist/M3UFlow-win32-x64/LEIA-ME.txt

      - name: Teste de abertura (abre o app uma vez)
        continue-on-error: true
        shell: pwsh
        run: |
          $env:M3UFLOW_SMOKE = "$PWD"
          $p = Start-Process -FilePath "dist/M3UFlow-win32-x64/M3UFlow.exe" -PassThru
          if (-not $p.WaitForExit(80000)) { $p.Kill() }
          if (Test-Path smoke.txt) {
            $t = (Get-Content smoke.txt -Raw)
            if ($t.StartsWith("OK")) { Write-Host "::notice::Teste de abertura: $t" }
            else { Write-Host "::error::Teste de abertura: $t"; exit 1 }
          } else {
            Write-Host "::error::Teste de abertura: o app não deixou resultado"; exit 1
          }

      - name: Compactar
        shell: pwsh
        run: |
          Remove-Item smoke.txt -ErrorAction SilentlyContinue
          Rename-Item dist/M3UFlow-win32-x64 M3UFlow
          Compress-Archive -Path dist/M3UFlow -DestinationPath M3UFlow-Windows.zip -CompressionLevel Optimal
          (Get-Item M3UFlow-Windows.zip).Length / 1MB

      - uses: actions/upload-artifact@v4
        with:
          name: M3UFlow-Windows
          path: windows/M3UFlow-Windows.zip
          retention-days: 90

      - name: Publicar (pré-lançamento, não afeta o app do celular)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "windows-v1.0.0"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag M3UFlow-Windows.zip --clobber
          } else {
            gh release create $tag M3UFlow-Windows.zip --prerelease --target $env:GITHUB_SHA `
              --title "M3UFlow para Windows 1.0.0" `
              --notes "Versão única para Windows. Baixe o M3UFlow-Windows.zip, extraia e abra o M3UFlow.exe."
          }
