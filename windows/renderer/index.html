<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data: blob:; media-src * blob: data:; connect-src *; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>M3UFlow</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Abertura -->
<section id="v-splash" class="view" hidden>
  <div class="splash-logo">
    <img class="splash-symbol" src="assets/logo_symbol.png" alt="">
    <img class="splash-word" src="assets/logo_wordmark.png" alt="M3UFlow">
  </div>
</section>

<!-- Barra de cima (todas as telas, menos abertura e player) -->
<header id="topbar" hidden>
  <img class="top-logo" src="assets/logo_wordmark.png" alt="M3UFlow">
  <div class="spacer"></div>
  <button id="navHome" class="icon-btn" data-nav title="Início (Esc)" aria-label="Início">
    <svg viewBox="0 -960 960 960"><path d="M240-200h120v-240h240v240h120v-360L480-740 240-560v360Zm-80 80v-480l320-240 320 240v480H520v-240h-80v240H160Zm320-350Z"/></svg>
  </button>
  <button id="navSettings" class="icon-btn" data-nav title="Configurações" aria-label="Configurações">
    <svg viewBox="0 -960 960 960"><path d="m370-80-16-128q-13-5-24.5-12T307-235l-119 50L78-375l103-78q-1-7-1-13.5v-27q0-6.5 1-13.5L78-585l110-190 119 50q11-8 23-15t24-12l16-128h220l16 128q13 5 24.5 12t22.5 15l119-50 110 190-103 78q1 7 1 13.5v27q0 6.5-2 13.5l103 78-110 190-118-50q-11 8-23 15t-24 12L590-80H370Zm70-80h79l14-106q31-8 57.5-23.5T639-327l99 41 39-68-86-65q5-14 7-29.5t2-31.5q0-16-2-31.5t-7-29.5l86-65-39-68-99 42q-22-23-48.5-38.5T533-694l-13-106h-79l-14 106q-31 8-57.5 23.5T321-633l-99-41-39 68 86 64q-5 15-7 30t-2 32q0 16 2 31t7 30l-86 65 39 68 99-42q22 23 48.5 38.5T427-266l13 106Zm42-180q58 0 99-41t41-99q0-58-41-99t-99-41q-59 0-99.5 41T342-480q0 58 40.5 99t99.5 41Zm-2-140Z"/></svg>
  </button>
  <div class="clock" id="clockTop">--:--</div>
</header>

<!-- Início -->
<section id="v-home" class="view" hidden>
  <div class="tiles">
    <button class="tile glass" id="tLive" data-nav>
      <svg viewBox="0 -960 960 960"><path d="m380-340 280-180-280-180v360Zm-60 220v-80H160q-33 0-56.5-23.5T80-280v-480q0-33 23.5-56.5T160-840h640q33 0 56.5 23.5T880-760v480q0 33-23.5 56.5T800-200H640v80H320ZM160-280h640v-480H160v480Zm0 0v-480 480Z"/></svg>
      <span>TV AO VIVO</span>
    </button>
    <button class="tile glass" id="tAdd" data-nav>
      <svg viewBox="0 -960 960 960"><path d="M440-440H200v-80h240v-240h80v240h240v80H520v240h-80v-240Z"/></svg>
      <span>ADICIONAR LISTA</span>
    </button>
    <button class="tile glass" id="tSettings" data-nav>
      <svg viewBox="0 -960 960 960"><path d="m370-80-16-128q-13-5-24.5-12T307-235l-119 50L78-375l103-78q-1-7-1-13.5v-27q0-6.5 1-13.5L78-585l110-190 119 50q11-8 23-15t24-12l16-128h220l16 128q13 5 24.5 12t22.5 15l119-50 110 190-103 78q1 7 1 13.5v27q0 6.5-2 13.5l103 78-110 190-118-50q-11 8-23 15t-24 12L590-80H370Zm70-80h79l14-106q31-8 57.5-23.5T639-327l99 41 39-68-86-65q5-14 7-29.5t2-31.5q0-16-2-31.5t-7-29.5l86-65-39-68-99 42q-22-23-48.5-38.5T533-694l-13-106h-79l-14 106q-31 8-57.5 23.5T321-633l-99-41-39 68 86 64q-5 15-7 30t-2 32q0 16 2 31t7 30l-86 65 39 68 99-42q22 23 48.5 38.5T427-266l13 106Zm42-180q58 0 99-41t41-99q0-58-41-99t-99-41q-59 0-99.5 41T342-480q0 58 40.5 99t99.5 41Zm-2-140Z"/></svg>
      <span>CONFIGURAÇÕES</span>
    </button>
  </div>
</section>

<!-- Canais -->
<section id="v-channels" class="view" hidden>
  <aside class="cats glass" id="cats"></aside>
  <div class="main">
    <div class="bar">
      <label class="search glass">
        <svg viewBox="0 -960 960 960"><path d="M784-120 532-372q-30 24-69 38t-83 14q-109 0-184.5-75.5T120-580q0-109 75.5-184.5T380-840q109 0 184.5 75.5T640-580q0 44-14 83t-38 69l252 252-56 56ZM380-400q75 0 127.5-52.5T560-580q0-75-52.5-127.5T380-760q-75 0-127.5 52.5T200-580q0 75 52.5 127.5T380-400Z"/></svg>
        <input id="search" type="text" placeholder="Buscar canal" data-nav autocomplete="off" spellcheck="false">
      </label>
      <div id="status" class="status"></div>
    </div>
    <button id="lastBtn" class="last glass" data-nav hidden></button>
    <div id="msg" class="msg" hidden></div>
    <div id="grid" class="grid"></div>
    <div id="spin" class="spinner" hidden></div>
  </div>
</section>

<!-- Configurações -->
<section id="v-settings" class="view" hidden>
  <div class="settings glass" id="settingsBox"></div>
</section>

<!-- Player -->
<section id="v-player" class="view" hidden>
  <video id="video" autoplay playsinline></video>
  <div id="loading" class="spinner big" hidden></div>
  <div id="pTop" class="p-top">
    <button id="pBack" class="pill-btn" data-nav>◀  Voltar</button>
    <div class="spacer"></div>
    <button id="pPrev" class="pill-btn" data-nav>◀  Anterior</button>
    <button id="pNext" class="pill-btn" data-nav>Próximo  ▶</button>
    <button id="pFull" class="pill-btn" data-nav>Tela cheia</button>
  </div>
  <div id="overlay" class="p-bar">
    <div class="p-text">
      <div id="pTitle" class="p-title"></div>
      <div id="pSub" class="p-sub"></div>
      <div id="pInfo" class="p-info" hidden></div>
    </div>
    <div class="clock big" id="clockPlayer">--:--</div>
  </div>
</section>

<div id="toast" class="toast" hidden></div>
<div id="dialogHost"></div>

<script src="../node_modules/hls.js/dist/hls.min.js"></script>
<script src="../node_modules/mpegts.js/dist/mpegts.js"></script>
<script src="../core.js"></script>
<script src="app.js"></script>
</body>
</html>
